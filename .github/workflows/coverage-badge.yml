name: Coverage Badge

on:
  push:
    branches: [master]
    paths-ignore:
      - .github/badges/**

concurrency:
  group: coverage-badge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-badge:
    name: Update coverage badge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests and generate coverage report
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Generate coverage badge
        uses: cicirello/jacoco-badge-generator@v2.12.1
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-workflow-summary: true

      - name: Commit badge if it changed
        run: |
          git add .github/badges/jacoco.svg

          if git diff --cached --quiet; then
            echo "Coverage badge is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update coverage badge"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload JaCoCo report
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/site/jacoco

  deploy-report:
    name: Publish coverage report
    needs: update-badge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy JaCoCo report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
