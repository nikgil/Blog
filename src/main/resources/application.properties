spring.application.name=blog
spring.freemarker.suffix=.ftl
spring.freemarker.expose-request-attributes=true

# Local development uses an ephemeral H2 database in PostgreSQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:blog;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.config.import=optional:file:.env[.properties]

blog.registration.enabled=${BLOG_REGISTRATION_ENABLED}

blog.registration.mail.host=${BLOG_MAIL_HOST}
blog.registration.mail.port=${BLOG_MAIL_PORT}
blog.registration.mail.username=${BLOG_MAIL_USERNAME}
blog.registration.mail.password=${BLOG_MAIL_API_KEY}

blog.registration.mail.approver=${BLOG_APPROVER_EMAIL}
blog.registration.mail.sender=${BLOG_MAIL_FROM}
blog.registration.url=${BLOG_BASE_URL}
blog.registration.jwt=${BLOG_JWT_SECRET}
