spring.datasource.url=jdbc:h2:mem:blog-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate

# Everything application.properties reads from ${BLOG_*} gets a fixed value
# here, so the tests pass on a clean checkout or in CI with no .env file. An
# unresolved placeholder fails the whole application context: the mail
# auto-configuration resolves spring.mail.host while evaluating a condition,
# and boolean/int keys fail binding.
blog.registration.enabled=false
blog.registration.url=http://localhost:8080
blog.registration.jwt=test-only-secret-0123456789abcdef-0123456789
blog.registration.mail.approver=owner@example.com
blog.registration.mail.sender=blog@example.com

# Mail needs a host and numeric port to be configured, but nothing is ever
# sent: the tests that care replace JavaMailSender with a mock.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
